name: Сборка проекта
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
      steps:
        - name: Клонировать код
        uses: action/checkout@v4

        - name: Проверить что Dockerfile на месте
        run: ls -la Dockerfile

        - name: Собрать образ
        run: docker build -t my-clean-site .

